# Render Blueprint — one-click deploy for God's Eye View.
#
# Render runs Node, which this app needs: ~25 API endpoints (CCTV proxy,
# flights, satellites, geocoding, weather) live in the Vite server, so a
# static host like GitHub Pages cannot serve it.
#
# Auto-deploy is on: every push to the default branch rebuilds and redeploys.
services:
  - type: web
    name: gods-eye-view
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Render's free tier runs Node 22 by default; this app requires 24.14.x or 26.x.
      - key: NODE_VERSION
        value: 24.15.0
      # REQUIRED. Paste your key in the Render dashboard — never commit it.
      # RESTRICT IT FIRST: Google Cloud Console -> Credentials -> your key ->
      # Application restrictions -> Websites -> add your Render URL. An
      # unrestricted key on a public site can be scraped and billed to you.
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      # ---- Camera licensing ----
      # These packs are OFF here on purpose. Their terms permit personal use but
      # NOT redistribution, which is what a public URL is:
      #   FL511 (Miami)      "individual use only ... not available for re-use
      #                       without the express written consent of FDOT"
      #   Autostrade (Italy)  all rights reserved
      #   Ozolio / GMCVB      permission required
      #   WeatherSTEM         written permission required
      #   Vedetta             no terms published
      # Everything still enabled is openly licensed (OGL, CC BY, CC0, or
      # commercial-use-permitted). See config/cctv_catalogs.json for each one.
      - key: CCTV_FL511_ENABLED
        value: "0"
      - key: CCTV_SOURCES_FILE
        value: ""
      - key: CCTV_WORLD_CATALOGS
        value: "ca-on,ca-toronto,ca-calgary,us-ny,us-il,us-wa,us-or,us-ut,us-ia,us-la,us-hi,ie-tii,fr-lyon,ch-geneva,fi-digitraffic,no-vegvesen,se-stockholm,se-goteborg,is-vegagerdin,ee-tarktee,lt-eismoinfo,hk-td,nz-nzta,au-nsw,au-qld,sg-lta,es-dgt,es-madrid-m30,es-malaga,es-vitoria"
      - key: CCTV_WORLD_MAX_PER_CATALOG
        value: "80"
      - key: CCTV_MAX_SOURCES
        value: "3000"
